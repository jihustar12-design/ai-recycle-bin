name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server (lint + unit test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../tools ../model
      - run: pytest -q

  e2e:
    name: E2E (fake device → server → DB)
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r server/requirements-dev.txt
      - name: Start server
        working-directory: server
        env:
          DB_PATH: /tmp/e2e.db
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
      - name: Run fake device (30% 전송 실패 포함)
        run: python tools/fake_device.py --count 30 --interval 0 --fail-rate 0.3 --seed 42
      - name: Verify DB
        run: |
          total=$(curl -sf localhost:8000/api/stats | python -c "import sys, json; print(json.load(sys.stdin)['total'])")
          echo "total events in DB: $total"
          test "$total" -eq 30
          python -c "import sqlite3; print(sqlite3.connect('/tmp/e2e.db').execute('SELECT label, COUNT(*) FROM sort_events GROUP BY label').fetchall())"

  firmware-logic:
    name: Firmware logic (host unit test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C firmware/tests

  firmware-build:
    name: Firmware build (XIAO ESP32S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache Arduino cores
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install ESP32 core & libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install ESP32Servo
      - name: Use example secrets
        run: cp firmware/smart_bin/secrets.example.h firmware/smart_bin/secrets.h
      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32S3:PSRAM=opi \
            --output-dir build \
            firmware/smart_bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: build/*.bin

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
