name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server (lint + unit test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../tools ../model
      - run: pytest -q

  e2e:
    name: E2E (fake device → server → DB)
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r server/requirements-dev.txt
      - name: Start server
        working-directory: server
        env:
          DB_PATH: /tmp/e2e.db
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
      - name: Run fake device (30% 전송 실패 포함, 샘플 사진 전송)
        run: python tools/fake_device.py --count 30 --interval 0 --fail-rate 0.3 --seed 42 --images tools/samples
      - name: Verify DB
        run: |
          total=$(curl -sf localhost:8000/api/stats | python -c "import sys, json; print(json.load(sys.stdin)['total'])")
          echo "total events in DB: $total"
          test "$total" -eq 30
          photos=$(curl -sf localhost:8000/api/stats | python -c "import sys, json; print(json.load(sys.stdin)['with_image'])")
          echo "events with photo: $photos"
          test "$photos" -gt 0
          first=$(curl -sf "localhost:8000/api/events?limit=1" | python -c "import sys, json; e=json.load(sys.stdin)[0]; print(e['id'] if e['has_image'] else '')")
          if [ -n "$first" ]; then curl -sf -o /tmp/p.jpg "localhost:8000/api/events/$first/image" && file /tmp/p.jpg | grep -q JPEG; fi
          python -c "import sqlite3; print(sqlite3.connect('/tmp/e2e.db').execute('SELECT label, COUNT(*) FROM sort_events GROUP BY label').fetchall())"

  firmware-logic:
    name: Firmware logic (host unit test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C firmware/tests

  firmware-build:
    name: Firmware build (XIAO ESP32S3, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: tflite-model     # 학습한 모델 + TFLite Micro (코어에 포함된 esp-tflite-micro)
            flags: ""
          - variant: stub-classifier  # 가짜 분류기 (모델 없이 서보·서버 연동 테스트용)
            flags: "-DUSE_TFLITE_MODEL=0"
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache Arduino cores
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install ESP32 core & libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install ESP32Servo
      - name: Use example secrets
        run: cp firmware/smart_bin/secrets.example.h firmware/smart_bin/secrets.h
      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32S3:PSRAM=opi \
            --build-property "compiler.cpp.extra_flags=${{ matrix.flags }}" \
            --output-dir build \
            firmware/smart_bin 2>&1 | tee build.log
          grep -E "Sketch uses|Global variables" build.log >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: build/*.bin

  model:
    name: Model accuracy (int8 model on TrashNet test)
    runs-on: ubuntu-latest
    env:
      TFLM_SHA: 6368cd2ddebb72e047509ccbc529afc321e804b9  # espressif/esp-tflite-micro (PC 테스트에 쓴 버전 고정)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow ai-edge-litert
      - name: Cache TrashNet / TFLite Micro
        uses: actions/cache@v4
        with:
          path: |
            model/.cache
            build/esp-tflite-micro
            firmware/tests/build
          key: model-${{ env.TFLM_SHA }}-${{ hashFiles('firmware/tests/Makefile') }}
      - name: Build test set from TrashNet (same script, same seed)
        run: python model/prepare_dataset.py
      - name: Python — accuracy of committed int8 model
        run: python model/evaluate.py --min-accuracy 0.78 --dump build/dump
      - name: Fetch TFLite Micro
        run: |
          if [ ! -d build/esp-tflite-micro ]; then
            curl -sSL -o /tmp/tflm.zip "https://github.com/espressif/esp-tflite-micro/archive/${TFLM_SHA}.zip"
            unzip -q /tmp/tflm.zip -d build && mv "build/esp-tflite-micro-${TFLM_SHA}" build/esp-tflite-micro
          fi
      - name: C++ — firmware preprocessing + TFLite Micro on the same test set
        run: |
          make -C firmware/tests -j4 model TFLM=$PWD/build/esp-tflite-micro DUMP=$PWD/build/dump \
            MIN888=0.78 MIN565=0.75 | tee cpp.log
          { echo; echo '### 펌웨어 C++ 추론 (TFLite Micro, PC)'; echo '```'; tail -6 cpp.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
