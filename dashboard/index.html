<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 분리수거함 대시보드</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --can: #d97706; --pet: #2563eb; --paper: #059669; --general: #6b7280; --empty: #c4c8cf; --warn: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1b2027; --text: #e8eaee; --muted: #9aa3af; --line: #2c333d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 24px 8px; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { margin: 0; font-size: 22px; }
  .status { color: var(--muted); font-size: 13px; }
  .status b { color: var(--paper); }
  main { padding: 8px 24px 32px; display: grid; gap: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 28px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: 70px 1fr 48px; align-items: center; gap: 8px; font-size: 14px; }
  .track { background: var(--line); border-radius: 6px; height: 14px; overflow: hidden; }
  .fill { height: 100%; border-radius: 6px; transition: width .4s; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; color: #fff; font-size: 12px; }
  .review { color: var(--warn); font-weight: 600; }
  select { font-size: 12px; padding: 2px 4px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>AI 분리수거함 대시보드</h1>
  <div class="status" id="status">연결 중…</div>
</header>
<main>
  <section class="kpis">
    <div class="card kpi"><div class="label">총 투입</div><div class="value" id="k-total">-</div></div>
    <div class="card kpi"><div class="label">평균 신뢰도</div><div class="value" id="k-conf">-</div></div>
    <div class="card kpi"><div class="label">평균 추론 시간</div><div class="value" id="k-lat">-</div></div>
    <div class="card kpi"><div class="label">확인 필요 (낮은 신뢰도)</div><div class="value" id="k-review">-</div></div>
    <div class="card kpi"><div class="label">오분류율 (신고 기준)</div><div class="value" id="k-mis">-</div></div>
  </section>

  <section class="grid2">
    <div class="card">
      <h2>클래스별 투입 수</h2>
      <div class="bars" id="bars"></div>
    </div>
    <div class="card">
      <h2>모델 버전별 비교</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>모델</th><th>건수</th><th>평균 신뢰도</th><th>신고</th><th>오분류율</th></tr></thead>
          <tbody id="models"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>최근 이벤트</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>시각</th><th>장치</th><th>분류</th><th>신뢰도</th><th>칸</th><th>모델</th><th>오분류 신고</th></tr></thead>
        <tbody id="events"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
  const NAMES = { can: "캔", pet: "페트", paper: "종이", general: "일반", empty: "빈칸" };
  const color = (l) => getComputedStyle(document.documentElement).getPropertyValue("--" + l).trim();
  const pct = (x) => (x * 100).toFixed(1) + "%";
  const $ = (id) => document.getElementById(id);

  async function getJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  function renderStats(s) {
    $("k-total").textContent = s.total;
    $("k-conf").textContent = s.total ? pct(s.avg_confidence) : "-";
    $("k-lat").textContent = s.total ? s.avg_latency_ms + " ms" : "-";
    $("k-review").textContent = s.needs_review;
    $("k-mis").textContent = s.feedback_count ? pct(s.misclassification_rate) : "-";

    const max = Math.max(1, ...Object.values(s.by_label));
    $("bars").innerHTML = Object.entries(s.by_label).map(([l, n]) => `
      <div class="bar"><span>${NAMES[l] || l}</span>
        <div class="track"><div class="fill" style="width:${(n / max) * 100}%;background:${color(l)}"></div></div>
        <span class="num">${n}</span></div>`).join("");

    $("models").innerHTML = Object.entries(s.by_model_version).map(([v, m]) => `
      <tr><td>${v}</td><td>${m.count}</td><td>${pct(m.avg_confidence)}</td><td>${m.feedback}</td>
      <td>${m.feedback ? pct(m.misclassification_rate) : "-"}</td></tr>`).join("") || `<tr><td colspan="5">데이터 없음</td></tr>`;
  }

  function renderEvents(rows) {
    $("events").innerHTML = rows.map((e) => `
      <tr>
        <td>${e.id}</td>
        <td>${new Date(e.received_at.endsWith("Z") ? e.received_at : e.received_at + "Z").toLocaleTimeString("ko-KR")}</td>
        <td>${e.device_id}</td>
        <td><span class="tag" style="background:${color(e.label)}">${NAMES[e.label] || e.label}</span>
            ${e.needs_review ? '<span class="review">확인 필요</span>' : ""}</td>
        <td>${pct(e.confidence)}</td>
        <td>${e.bin}</td>
        <td>${e.model_version}</td>
        <td><select data-id="${e.id}">
              <option value="">정답 선택</option>
              ${Object.entries(NAMES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
            </select></td>
      </tr>`).join("") || `<tr><td colspan="8">아직 이벤트가 없습니다</td></tr>`;
  }

  document.addEventListener("change", async (ev) => {
    const sel = ev.target;
    if (!sel.matches("select[data-id]") || !sel.value) return;
    await fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ event_id: Number(sel.dataset.id), correct_label: sel.value }),
    });
    sel.disabled = true;
    refresh();
  });

  async function refresh() {
    // 신고 선택 중일 때 표가 다시 그려지지 않도록
    if (document.activeElement && document.activeElement.matches("select[data-id]")) return;
    try {
      const [s, ev] = await Promise.all([getJSON("/api/stats"), getJSON("/api/events?limit=20")]);
      renderStats(s);
      renderEvents(ev);
      $("status").innerHTML = `<b>●</b> 실시간 · ${new Date().toLocaleTimeString("ko-KR")} 갱신`;
    } catch (e) {
      $("status").textContent = "서버 연결 실패: " + e.message;
    }
  }

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
